name: Something isn't working
description: A stream, chat or sign-in problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: input
    id: source
    attributes:
      label: Stream
      placeholder: Twitch live, Twitch VOD, YouTube, and the channel or URL if public
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Streams 0.5.4 · IINA 1.5.1 · macOS 26 · Apple silicon or Intel"
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Stream… 2. …"
