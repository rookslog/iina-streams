name: CI

# Every branch and PR is tested and produces a commit-stamped beta archive.
# Only a v* tag builds the stable package (scripts/build.py refuses stable
# packaging anywhere else) and publishes the GitHub Release that IINA's
# "Install from GitHub" downloads in preference to main's source zip.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version metadata
        run: npm run check:version
      - name: Run JavaScript tests
        run: npm test
      - name: Run Python tests
        run: npm run test:py
      - name: Build beta package
        run: npm run build:beta
      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: iina-streams-beta-${{ github.sha }}
          path: |
            dist/beta/*.iinaplgz
            dist/beta/build-manifest.json

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.py checks the tag points at HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches version
        run: npm run check:version
      - name: Build stable package
        run: npm run build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.iinaplgz
            dist/release/build-manifest.json
          generate_release_notes: true
