<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streams — Direction P</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main class="panel" id="panel">
  <header class="top">
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="6.75" cy="6.75" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.2 10.2L13.75 13.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search">
      <button type="button" class="search-clear" id="search-clear" aria-label="Clear" title="Clear" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6" fill="currentColor" opacity="0.28"/>
          <path d="M5.75 5.75L10.25 10.25M10.25 5.75L5.75 10.25" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="People" hidden></div>
  </header>

  <section class="now-wrap" id="now-wrap" aria-label="Live">
    <div class="now" id="now" role="list"></div>
  </section>

  <section class="timeline scroll" id="timeline" role="listbox" aria-label="Timeline"></section>
</main>

<script src="../shared/snapshot.js"></script>
<script src="../shared/viewer.js"></script>
<script src="../shared/util.js"></script>
<script src="panel.js"></script>
</body>
</html>
