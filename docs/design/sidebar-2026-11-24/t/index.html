<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direction T — Sidebar</title>
<link rel="stylesheet" href="../shared/frame.css">
</head>
<body>
<script src="../shared/snapshot.js"></script>
<script src="../shared/viewer.js"></script>
<script src="../shared/util.js"></script>
<script src="../shared/frame.js" data-panel="panel.html" data-label="Direction T"></script>
<script>
(function () {
  var panel = document.getElementById("panel");
  if (!panel) return;
  function sendHash() {
    if (panel.contentWindow) panel.contentWindow.postMessage({ type: "hash", hash: location.hash }, "*");
  }
  panel.addEventListener("load", sendHash);
  window.addEventListener("hashchange", sendHash);
})();
</script>
</body>
</html>
