# reader profile — isolated, read-only close-reading lanes (independent-audit experiment, 2026-11-09)
# Layered on top of ~/.codex/config.toml by `codex -p reader`. Takes effect only when named.
# Intent: shell tool in a read-only sandbox; no skills, plugins, MCP, hooks, memories, web or subagents.
# Verify with: codex -p reader debug prompt-input probe
model = "gpt-6.1-terra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
approval_policy = "never"
web_search = "disabled"

[features]
plugins = false
hooks = false
memories = false
multi_agent = false
apps = false

[skills.bundled]
enabled = false

[mcp_servers.hf-mcp-server]
enabled = false
[mcp_servers.headroom]
enabled = false
[mcp_servers.computer-use]
enabled = false
[mcp_servers.zlibrary]
enabled = false
[mcp_servers.codebase-memory-mcp]
enabled = false
[mcp_servers.node_repl]
enabled = false
[mcp_servers.openaiDeveloperDocs]
enabled = false

