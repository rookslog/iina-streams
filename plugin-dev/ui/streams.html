<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IINA Streams</title>
<link rel="stylesheet" href="streams.css">
</head>
<body>
<main class="panel" aria-label="Streams controls">
  <header>
    <div class="eyebrow">TWITCH STREAM</div>
    <h1 id="channel" aria-label="Channel">Stream</h1>
    <div id="status" role="status" aria-live="polite">Connecting…</div>
  </header>
  <section aria-labelledby="quality-title">
    <div class="titleRow"><h2 id="quality-title">Playback quality</h2>
      <button id="refresh" type="button" aria-label="Refresh available stream qualities" title="Refresh available qualities">↻</button>
    </div>
    <label class="assistive" for="quality">Quality</label>
    <select id="quality" aria-describedby="quality-help" disabled>
      <option value="auto720">Auto · prefer 720p</option>
    </select>
    <p class="hint" id="quality-help">Changing quality briefly reconnects playback.</p>
  </section>
  <p id="error" class="error" role="alert" hidden></p>
  <div class="footer">
    <button id="hide" class="secondary" type="button">Hide controls</button>
    <span class="subtle">Chat is off</span>
  </div>
</main>
<script src="streams.js"></script>
</body></html>
