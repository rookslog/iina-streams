<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
 <title>Open Stream</title>
 <link rel="stylesheet" href="open.css">
</head>
<body>
 <form id="open-form" aria-label="Open Stream">
  <input id="open-input" type="text" placeholder="Channel or URL" aria-label="Channel or URL" spellcheck="false"
   autocomplete="off" autocapitalize="off" autofocus>
 </form>
 <div id="offline-vods" class="offline-vods" hidden>
  <span id="offline-busy" class="busy-indicator" role="status" aria-label="Loading recent broadcasts" hidden></span>
  <p id="offline-empty" class="muted" role="status" hidden></p>
  <ul id="offline-list" class="vod-list" aria-label="Recent broadcasts" hidden></ul>
 </div>
 <script src="open.js"></script>
</body>
</html>
