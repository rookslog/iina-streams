<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
 <title>Open Stream</title>
 <link rel="stylesheet" href="open.css">
</head>
<body>
 <form id="open-form" aria-label="Open Stream">
  <svg class="magnifier" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="6.8" cy="6.8" r="4.6"></circle><path d="M10.3 10.3L14 14"></path></svg>
  <input id="open-input" type="text" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false"
   placeholder="Channel or URL" aria-label="Channel or URL" spellcheck="false" autocomplete="off" autocapitalize="off" autofocus>
  <button id="open-clear" class="clear" type="button" tabindex="-1" aria-label="Clear" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7"></circle><path d="M5.5 5.5l5 5M10.5 5.5l-5 5"></path></svg></button>
 </form>
 <div id="suggestions-area" class="suggestions-area">
  <div id="suggestions" class="suggestions" role="listbox" aria-label="Suggestions"></div>
  <div id="follows" class="follows" aria-live="polite" hidden>
   <button id="follows-connect" class="push" type="button" hidden></button>
   <span id="follows-busy" class="busy-indicator" role="status" aria-label="Connecting to Twitch" hidden></span>
   <span id="follows-code" class="follows-code" hidden></span>
   <button id="follows-open" class="push" type="button" hidden></button>
  </div>
  <div id="suggestions-empty" class="suggestions-empty" aria-hidden="true" hidden>
   <svg viewBox="0 0 40 32" focusable="false"><circle cx="15" cy="11" r="5.25"></circle><path d="M4.5 28.5c0-6 4.7-10 10.5-10s10.5 4 10.5 10"></path><path d="M23.6 5.1a4.6 4.6 0 1 1 1.9 8.6"></path><path d="M28.5 18.7c4.1.9 7 4.6 7 9.8"></path></svg>
  </div>
 </div>
 <span id="hint-open" hidden>Right Arrow shows recent broadcasts</span>
 <span id="hint-close" hidden>Left Arrow hides recent broadcasts</span>
 <div id="announce" class="visually-hidden" role="status" aria-live="polite"></div>
 <div id="offline-vods" class="offline-vods" hidden>
  <span id="offline-busy" class="busy-indicator" role="status" aria-label="Loading recent broadcasts" hidden></span>
  <p id="offline-empty" class="muted" role="status" hidden></p>
  <ul id="offline-list" class="vod-list" aria-label="Recent broadcasts" hidden></ul>
 </div>
 <script src="open.js"></script>
</body>
</html>
