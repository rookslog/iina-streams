<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src wss://irc-ws.chat.twitch.tv:443; img-src 'none'"><title>Streams</title><link rel="stylesheet" href="sidebar.css"></head>
<body>
 <header class="stream-header"><div class="identity"><h1 id="title">Streams</h1><div id="source" class="secondary"></div></div><button id="open" class="icon" title="Open another stream" aria-label="Open another stream">＋</button><button id="hide" class="icon" title="Hide Streams" aria-label="Hide Streams">×</button></header>
 <nav id="tabs" class="tabs" role="tablist" aria-label="Stream inspector" hidden><button id="playback-tab" role="tab" aria-selected="true" aria-controls="playback">Playback</button><button id="chat-tab" role="tab" aria-selected="false" aria-controls="chat-panel" tabindex="-1">Chat</button></nav>
 <section id="playback" aria-label="Playback settings"><div class="quality-row"><label for="quality">Quality</label><select id="quality" aria-label="Playback quality"></select><button id="refresh" class="icon" title="Refresh available qualities" aria-label="Refresh available qualities">↻</button></div><div id="transition" class="secondary" role="status" hidden></div><div id="playback-error" class="error" role="alert" hidden></div></section>
 <section id="chat-panel" aria-label="Chat" class="chat-panel">
  <div class="chat-heading"><h2>Chat</h2><span id="chat-kind" class="secondary"></span><div class="spacer"></div><label class="switch" title="Toggle chat on or off"><input id="chat-toggle" type="checkbox" role="switch" aria-label="Show chat"><span class="switch-track"></span></label><button id="appearance-toggle" class="icon gear" aria-label="Chat settings" title="Chat settings" aria-expanded="false">⚙</button></div>
  <div id="chat-actions" class="action-row"><button id="connect">Sign in with Twitch</button><button id="import" hidden>Import archive…</button><button id="fetch" hidden>Fetch replay</button><button id="resume" hidden>Resume replay</button></div>
  <div id="auth-panel" class="auth-panel" hidden><div id="auth-setup"><button id="open-console" type="button">Open Twitch Developer Console</button><ol class="setup-steps"><li>Register an app with any name</li><li>OAuth Redirect URL: <code>http://localhost</code></li><li>Client Type: Public</li></ol><label for="client-id">Client ID</label><input id="client-id" type="text" spellcheck="false" autocomplete="off" placeholder="Paste Client ID"><button id="authorize" disabled>Continue</button></div><div id="auth-retry" class="action-row" hidden><button id="retry">Try again</button><button id="use-other-id" class="text-button">Use a different Client ID</button></div></div>
  <div id="auth-code-panel" class="auth-panel" hidden><div id="auth-code" class="auth-code"></div><div class="action-row"><button id="authorize-open">Copy code &amp; open Twitch</button></div></div>
  <div id="account-row" class="account-row" hidden><span id="account-label" class="secondary"></span><button id="forget" class="text-button">Sign out</button></div>
  <div id="chat-status" class="chat-status secondary" role="status" hidden></div>
  <div id="chat-error" class="error" role="alert" hidden></div>
  <section id="appearance" class="appearance" aria-label="Chat settings" hidden>
   <label class="setting"><span>Display</span><select id="presentation"><option value="sidebar">Sidebar</option><option value="overlay">Over video</option></select></label>
   <label class="setting"><span>Text size <span id="font-size-val" class="secondary"></span></span><input id="font-size" type="range" min="12" max="24" step="1" aria-label="Chat text size"></label>
   <label class="setting"><span>Spacing <span id="spacing-val" class="secondary"></span></span><input id="spacing" type="range" min="2" max="10" step="1" aria-label="Message spacing"></label>
   <label class="setting"><span>Timestamps</span><input id="timestamps" type="checkbox" aria-label="Show message timestamps"></label>
   <div id="overlay-settings"><label class="setting"><span>Glass opacity <span id="opacity-val" class="secondary"></span></span><input id="opacity" type="range" min="0" max="0.9" step="0.05" aria-label="Overlay background opacity"></label><label class="setting"><span>Snap corner</span><select id="placement"><option value="tr">Top right</option><option value="tl">Top left</option><option value="br">Bottom right</option><option value="bl">Bottom left</option><option value="custom">Custom</option></select></label><p class="secondary">Drag chat on the video to move or snap, drag corner to resize, and scroll to read history.</p></div>
   <div class="action-row"><button id="reset" class="text-button">Reset appearance &amp; position</button></div>
  </section>
  <div id="replay-controls" class="replay-controls" hidden><label for="offset">Chat offset</label><input id="offset" type="number" min="-2592000" max="2592000" step="1" value="0" title="Seconds added to video time to find the original chat"><span class="secondary">s</span><button id="first" class="text-button" title="Seek to the first available chat message">First message</button></div>
  <div id="overlay-note" class="overlay-note secondary" hidden>Chat is displayed over the video.<button id="hide-for-overlay" class="text-button">Hide inspector</button></div>
  <div id="messages" class="messages" role="log" aria-label="Read-only chat messages" aria-live="off" tabindex="0"></div>
  <button id="follow" class="follow" hidden>Latest messages ↓</button>
 </section>
 <script src="sidebar.js"></script>
</body></html>
